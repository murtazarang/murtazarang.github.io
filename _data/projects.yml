- id: casrl
  title: Coordination for Scale RL (casRL)
  date: 2020–Present
  role: Sole creator and principal architect
  mark: casRL
  url: https://github.com/multiagentrl/casRL
  tags: [Python, PyTorch, RL, MARL, CUDA]
  description: >-
    An open-source research framework that builds RL and MARL experiments from reusable implementations of policies, rollout collection, replay, objectives, optimization, and model updates.
    casRL implements more than 100 algorithms and variants across online, offline, hybrid, single-agent, and multi-agent learning and sustains 2–4 million environment steps per second during end-to-end single-node training on one CPU and one GPU.

- id: field-topology
  title: Field-Topology Feedback for Heterogeneous Swarms
  date: Current research
  role: Lead researcher
  mark: Z
  image: morton.png
  image_alt: Multi-agent environments and spatial grids arranged using Morton order
  url: /research/#field-topology
  tags: [MARL, Swarm Coordination, Spatial Topology]
  description: >-
    Field-topology feedback based on Gray-code Morton order for coordinating heterogeneous swarms over spatially structured fields.
    A manuscript is in preparation for ICRA 2027.

- id: sarnet
  title: Structured Attentive Reasoning Network (SARNet)
  date: 2018–2020
  role: Creator and first author
  mark: SAR
  image: sarnet.png
  image_alt: SARNet architecture with thought, question, memory, action, and critic units
  image_fit: contain
  url: https://github.com/caslab-vt/SARNet
  tags: [MARL, Attention, Communication, TensorFlow]
  description: >-
    A memory-based attention architecture that learns communication and structured reasoning in cooperative and competitive multi-agent tasks.
    The work appeared at NeurIPS 2020 and includes a multiprocessing TensorFlow training implementation.

